<body class="page-contact">
<script src="../header.js"></script>
<main id="content" class="page-main">
  <div class="wrap">
    <div class="essay contact-intro">
      <p class="kicker">Contact</p>
      <h1>Contact us</h1>
      <p>This is an educational site about the coastal dune lakes of Walton County. Questions and corrections are welcome.</p>
    </div>
    <form id="contact-form" class="contact-form" action="/api/contact" method="post" novalidate>
      <div class="hp-field" aria-hidden="true">
        <label for="hp-field">Leave this field empty</label>
        <input id="hp-field" name="hp_field" type="text" tabindex="-1" autocomplete="off" value="">
      </div>
      <label for="contact-name">Name <span class="field-note">(required)</span></label>
      <input id="contact-name" name="name" type="text" required maxlength="100" autocomplete="name">
      <label for="contact-email">Email <span class="field-note">(required)</span></label>
      <input id="contact-email" name="email" type="email" required maxlength="254" autocomplete="email" inputmode="email">
      <label for="contact-subject">Subject <span class="field-note">(optional)</span></label>
      <input id="contact-subject" name="subject" type="text" maxlength="140" autocomplete="off">
      <label for="contact-message">Message <span class="field-note">(required)</span></label>
      <textarea id="contact-message" name="message" required maxlength="4000"></textarea>
      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      <div class="form-actions">
        <button class="button solid" type="submit">Send message</button>
      </div>
    </form>
    <div id="contact-success" class="contact-success" hidden tabindex="-1">
      <h2>Message sent</h2>
      <p>Thank you. Your message is on its way.</p>
    </div>
  </div>
</main>
<script src="../footer.js"></script>
